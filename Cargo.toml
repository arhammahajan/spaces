[workspace]
resolver = "2"
members = [
    "crates/spaces-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arhammahajan/spaces"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

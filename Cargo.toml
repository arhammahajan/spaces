[workspace]
resolver = "2"
members = [
    "crates/spaces-types",
    "crates/spaces-pty",
    "crates/spaces-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arhammahajan/spaces"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = ["term", "process", "signal", "fs", "ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "sync", "time", "process"] }
tracing = "0.1"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-and-types:
    name: Rust & TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Verify ts-rs TypeScript bindings are up to date
        run: ./scripts/generate-types.sh --check

      - name: Install Bun workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript workspaces
        run: bun run typecheck

      - name: Run TypeScript workspace tests
        run: bun run test

  go-legacy:
    name: Legacy Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

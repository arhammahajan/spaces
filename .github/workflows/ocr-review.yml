# OpenCodeReview - GitHub Actions PR Auto-Review (OpenCode Go)
#
# Runs Alibaba OpenCodeReview automatically on non-draft PRs
# (opened/synchronize/reopened/ready_for_review) and on-demand when an
# OWNER/MEMBER/COLLABORATOR comments '/open-code-review' or '@open-code-review'
# on a PR.
#
# Required OpenCode Console setup:
#   A GitHub Actions OIDC service account configured for this repository.
#   No static API key secret is needed — the workflow exchanges GitHub's OIDC
#   token for a short-lived OpenCode access token on each run.
#
# Optional GitHub Actions repository variables (Settings -> Secrets and variables -> Actions):
#   OCR_LLM_MODEL            OpenCode Go model ID (default: deepseek-v4.1-flash)
#   OCR_LLM_URL              API endpoint URL (default: https://opencode.ai/inference/go/openai/v1/chat/completions)
#   OCR_LLM_USE_ANTHROPIC    'false' for OpenAI-compatible, 'true' for Anthropic (default: false)
#   OCR_LLM_REASONING_EFFORT Model reasoning effort: low | high | max for deepseek-v4.1-flash (default: unset)
#   OCR_REVIEW_EFFORT        OCR review effort preset: low | medium | high (default: medium)

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft)
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # Uses pull_request_target so secrets are available for PRs from forks.
  # Safe because the action checks out the trusted base and only reads PR blobs
  # without executing untrusted PR code.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft)
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sS --fail-with-body --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -er .value)
          token=$(curl -sS --fail-with-body https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_98ed2673-9455-44dd-a811-c756428f36d0 \
            -d subject_token="$oidc" | jq -er .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@d29ca2044a42ea297a7fa93692d0f5ac8f38d84e # v1.14.0
        with:
          ocr_version: '1.14.0'
          llm_url: ${{ vars.OCR_LLM_URL || 'https://opencode.ai/inference/go/openai/v1/chat/completions' }}
          llm_auth_token: ${{ env.OPENCODE_API_KEY }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'deepseek-v4.1-flash' }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          llm_extra_headers: "x-opencode-session=ocr-${{ github.run_id }}-${{ github.run_attempt }}"
          llm_extra_body: '{}'
          llm_reasoning_effort: ${{ vars.OCR_LLM_REASONING_EFFORT || '' }}
          effort: ${{ vars.OCR_REVIEW_EFFORT || 'medium' }}
          sticky_summary: 'true'
          incremental: 'true'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
